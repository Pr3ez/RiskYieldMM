[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskyieldmm"
version = "0.1.0"
description = "Leakage-aware ML research system for cryptocurrency perpetual futures"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "tqdm>=4.66",
    "pydantic>=2.0",
]

[project.scripts]
riskyieldmm-ledger = "riskyieldmm.trading.ledger_cli:main"

[project.optional-dependencies]
ci = [
    "cryptography>=42",
    "pytest>=8,<10",
    "ruff>=0.8,<1.0",
    "websockets==16.0",
]
dev = [
    "cryptography>=42",
    "pytest>=8,<10",
    "ruff>=0.8,<1.0",
    "websockets==16.0",
]
governance = [
    "cryptography>=42",
]
market-data = [
    "databento>=0.50",
    "yfinance>=0.2.40",
]
research = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "torch>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "optuna>=3.5",
    "mapie>=0.8",
    "mlflow>=2.10",
]
transport = [
    "cryptography>=42",
    "websockets==16.0",
]
rust = [
    "maturin>=1.7",
]

[tool.setuptools.packages.find]
include = [
    "fetchingByBit*",
    "fetchingMultiAsset*",
    "regression_feature_engineering*",
    "riskyieldmm*",
    "schemas*",
    "scripts*",
]
namespaces = true

[tool.ruff]
# Same as Black
line-length = 88
indent-width = 4

# Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable common rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "C901",   # too complex
    "B905",   # zip() without strict= (pedantic)
]

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["regression_feature_engineering", "riskyieldmm", "scripts", "schemas"]
