[project]
name = "riskyieldmm"
version = "0.1.0"
description = "ML trading system for perpetual futures"
requires-python = ">=3.10"

[tool.ruff]
# Same as Black
line-length = 88
indent-width = 4

# Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable common rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "C901",   # too complex
    "B905",   # zip() without strict= (pedantic)
]

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["scripts", "schemas"]
