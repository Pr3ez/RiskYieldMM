name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Syntax and import-safety lint
        run: |
          ruff check . \
            --select E9,F63,F7,F82 \
            --exclude Archive \
            --exclude notebooks \
            --exclude test_output

      - name: Run focused workflow contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_fetch_bybit_market_data.py \
            tests/test_htf_workflow_contract.py \
            tests/test_htf_incremental_resume.py

  astra-extension:
    name: VS Code extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/astra-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/astra-workflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=low

  rust-helpers:
    name: Rust helper checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riskyield_rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust helper crate
        run: cargo check --locked
